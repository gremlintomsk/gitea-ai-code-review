name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Review the PR diff with an LLM
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Free model on OpenRouter (deepseek :free tiers were retired); override via repo variable REVIEW_MODEL.
          MODEL: ${{ vars.REVIEW_MODEL != '' && vars.REVIEW_MODEL || 'nvidia/nemotron-3-super-120b-a12b:free,openai/gpt-oss-20b:free,google/gemma-4-31b-it:free,z-ai/glm-5.2:free' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .gitea/scripts/review.mjs
